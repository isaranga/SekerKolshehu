exclude: ^output/
repos:
  # pre-commit-hooks, run as `python -m` instead of via the repo's console-script
  # .exe launchers, which Windows Smart App Control blocks as unsigned.
  # Hook metadata mirrors upstream .pre-commit-hooks.yaml at v6.0.0.
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: end-of-file-fixer
        name: fix end of files
        entry: python -m pre_commit_hooks.end_of_file_fixer
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: check-json
        name: check json
        entry: python -m pre_commit_hooks.check_json
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        types: [json]
      - id: check-yaml
        name: check yaml
        entry: python -m pre_commit_hooks.check_yaml
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: python -m pre_commit_hooks.check_toml
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        types: [toml]
      - id: check-added-large-files
        name: check for added large files
        entry: python -m pre_commit_hooks.check_added_large_files
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        stages: [pre-commit, pre-push, manual]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: python -m pre_commit_hooks.check_merge_conflict
        language: python
        additional_dependencies: [pre-commit-hooks==6.0.0]
        types: [text]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.24
    hooks:
      - id: uv-lock   # keeps uv.lock in sync with pyproject.toml
