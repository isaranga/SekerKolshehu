[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
seker = "seker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seker = ["templates/*.html"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.6", "pre-commit>=3.7"]

[tool.ruff]
line-length = 100
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
