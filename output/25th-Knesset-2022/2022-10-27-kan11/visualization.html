<script>
  // Apply a saved theme choice before first paint
  try {
    const saved = localStorage.getItem("seker-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch {}
</script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series: #2a78d6;
    --series-soft: #86b6ef;
    --highlight: rgba(42, 120, 214, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series: #3987e5;
      --series-soft: #184f95;
      --highlight: rgba(57, 135, 229, 0.16);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series: #3987e5;
    --series-soft: #184f95;
    --highlight: rgba(57, 135, 229, 0.16);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 18px; font-weight: 600; margin: 40px 0 4px; }
  .section-note { color: var(--text-secondary); font-size: 14px; margin: 0 0 16px; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  #theme-toggle {
    flex: none;
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  #theme-toggle:hover { background: var(--highlight); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  /* Metadata */
  .meta {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px;
    margin: 24px 0 0;
    overflow: hidden;
    background: var(--border);
  }
  .meta > div { background: var(--surface); padding: 12px 16px; }
  .meta dt { color: var(--text-secondary); font-size: 13px; }
  .meta dd { margin: 2px 0 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .meta a { color: var(--series); }

  /* Summary table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 12px; text-align: start; white-space: nowrap; }
  th {
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    border-bottom: 1px solid var(--axis);
    vertical-align: bottom;
  }
  td { border-bottom: 1px solid var(--grid); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--highlight); }
  td.num, th.num { text-align: right; }
  .party-name { font-weight: 600; }
  .symbol { color: var(--text-muted); font-size: 13px; margin-inline-start: 6px; }
  td.ci-chart, th.ci-chart { padding-block: 4px; width: 260px; min-width: 260px; }
  .footnote { color: var(--text-secondary); font-size: 14px; padding: 12px 16px 0; margin: 0; }

  /* Histograms */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .hist { padding: 16px 16px 8px; scroll-margin-top: 16px; transition: box-shadow 0.3s; }
  .hist.flash { box-shadow: 0 0 0 2px var(--series); }
  .hist h3 { font-size: 16px; font-weight: 600; margin: 0; }
  .hist .summary { color: var(--text-secondary); font-size: 13px; margin: 2px 0 8px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--text-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--axis); stroke-width: 1; }
  .bar-in { fill: var(--series); }
  .bar-out { fill: var(--series-soft); }
  .hit { fill: transparent; }
  .hover-band.on { fill: var(--highlight); }
  .hover-band { fill: transparent; pointer-events: none; }
  .ci-track { stroke: var(--grid); stroke-width: 1; }
  .ci-bar { fill: var(--series); }
  .ci-dot { fill: var(--text-primary); stroke: var(--surface); stroke-width: 2; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 16px;
    color: var(--text-secondary); font-size: 13px; margin-bottom: 12px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 10;
    white-space: nowrap;
  }
  #tooltip.on { opacity: 1; }
  #tooltip .tt-value { font-weight: 600; }
  #tooltip .tt-label { color: var(--text-secondary); }
</style>

</main>

const MAX_SEATS_SHOWN = 50;
const SVG_NS = "http://www.w3.org/2000/svg";

const fmtInt = n => n.toLocaleString("he-IL");
const fmtPct = (x, digits = 1) => (x * 100).toLocaleString("he-IL", {
  minimumFractionDigits: digits, maximumFractionDigits: digits,
}) + "%";
const fmtNum = (x, digits = 1) => x.toLocaleString("he-IL", {
  minimumFractionDigits: digits, maximumFractionDigits: digits,
});
const ltr = s => `<bdi dir="ltr">${s}</bdi>`;

/* ---------- Theme toggle ---------- */
const themeToggle = document.getElementById("theme-toggle");
const currentTheme = () => document.documentElement.dataset.theme
  ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const updateThemeToggle = () => {
  themeToggle.textContent = currentTheme() === "dark" ? "מצב בהיר" : "מצב כהה";
};
themeToggle.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("seker-theme", next); } catch {}
  updateThemeToggle();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeToggle);
updateThemeToggle();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));
const rangeText = p => ltr(`${p.ci_lower}–${p.ci_upper}`);

function el(tag, attrs = {}, parent) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

// Bar path with a 4px rounded top, square at the baseline.
function barPath(x, y, w, h, r = 4) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function niceMax(v) {
  const steps = [0.02, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.8, 1];
  return steps.find(s => s >= v) ?? 1;
}

/* ---------- Tooltip ---------- */
const tooltip = document.getElementById("tooltip");
function showTooltip(evt, html) {
  tooltip.innerHTML = html;
  tooltip.classList.add("on");
  const pad = 12;
  const rect = tooltip.getBoundingClientRect();
  let x = evt.clientX + pad;
  let y = evt.clientY - rect.height - pad;
  if (x + rect.width > window.innerWidth - 8) x = evt.clientX - rect.width - pad;
  if (y < 8) y = evt.clientY + pad;
  tooltip.style.left = `${Math.max(8, x)}px`;
  tooltip.style.top = `${y}px`;
}
function hideTooltip() { tooltip.classList.remove("on"); }

/* ---------- Header ---------- */
function renderHeader() {
  const m = DATA.meta;
  // ISO yyyy-mm-dd → dd/mm/yyyy
  const date = m.date && String(m.date).replace(/^(\d{4})-(\d{2})-(\d{2})$/, "$3/$2/$1");
  document.title = `${m.media ?? DATA.poll_name} ${date ?? ""} — סימולציית סקר`;
  document.getElementById("title").innerHTML =
    `סקר ${esc(m.media ?? DATA.poll_name)}${date ? ` · ${ltr(esc(date))}` : ""}`;

  const items = [
    ["תאריך", date && ltr(esc(date))],
    ["מזמין הסקר", m.media && esc(m.media)],
    ["מכון סקרים", m.pollster && `<bdi>${esc(m.pollster)}</bdi>`],
    ["גודל מדגם", m.sample_size && fmtInt(m.sample_size)],
    ["מספר סימולציות", fmtInt(DATA.iterations)],
    ["אחוז החסימה", fmtPct(DATA.threshold, 2)],
    ["מקור", m.link && `<a href="${esc(m.link)}" target="_blank" rel="noopener">קישור לסקר</a>`],
  ];
  document.getElementById("meta").innerHTML = items
    .filter(([, v]) => v)
    .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`)
    .join("");
}

/* ---------- Summary table ---------- */
const CI_W = 240, CI_H = 24, CI_PAD = 8;
const ciX = s => CI_PAD + (Math.min(s, MAX_SEATS_SHOWN) / MAX_SEATS_SHOWN) * (CI_W - 2 * CI_PAD);

function renderCiAxis() {
  const svg = el("svg", { viewBox: `0 0 ${CI_W} 16`, width: CI_W, dir: "ltr", "aria-hidden": "true" });
  for (let s = 0; s <= MAX_SEATS_SHOWN; s += 10) {
    el("text", { x: ciX(s), y: 12, "text-anchor": "middle" }, svg).textContent = s;
  }
  document.getElementById("ci-axis").appendChild(svg);
}

function ciSvg(p) {
  const svg = el("svg", {
    viewBox: `0 0 ${CI_W} ${CI_H}`, width: CI_W, dir: "ltr", role: "img",
    "aria-label": `רווח סמך ${p.ci_lower} עד ${p.ci_upper}, ממוצע ${p.avg_seats}`,
  });
  for (let s = 0; s <= MAX_SEATS_SHOWN; s += 10) {
    el("line", { x1: ciX(s), x2: ciX(s), y1: 2, y2: CI_H - 2, class: "ci-track" }, svg);
  }
  const x0 = ciX(p.ci_lower), x1 = ciX(p.ci_upper);
  el("rect", { x: x0 - 2, y: CI_H / 2 - 4, width: Math.max(4, x1 - x0 + 4), height: 8, rx: 4, class: "ci-bar" }, svg);
  el("circle", { cx: ciX(p.avg_seats), cy: CI_H / 2, r: 5, class: "ci-dot" }, svg);
  return svg;
}

function renderTable(active, inactive) {
  const tbody = document.getElementById("rows");
  active.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="party-name">${esc(p.name)}</span><span class="symbol">${esc(p.symbol)}</span></td>
      <td class="num">${fmtPct(p.poll_share)}</td>
      <td class="num">${fmtNum(p.avg_seats, 2)}</td>
      <td class="num">${rangeText(p)}</td>
      <td class="num">${fmtPct(p.prob_pass_threshold)}</td>
      <td class="ci-chart"></td>`;
    tr.lastElementChild.appendChild(ciSvg(p));
    tr.addEventListener("click", () => {
      const card = document.getElementById(`hist-${i}`);
      card.scrollIntoView({ behavior: "smooth", block: "start" });
      card.classList.add("flash");
      setTimeout(() => card.classList.remove("flash"), 1200);
    });
    tbody.appendChild(tr);
  });

  if (inactive.length) {
    const fn = document.getElementById("footnote");
    fn.hidden = false;
    fn.innerHTML = "לא עברו את אחוז החסימה באף סימולציה: " + inactive
      .map(p => `${esc(p.name)} (${fmtPct(p.poll_share)})`)
      .join(", ");
  }
}

/* ---------- Histograms ---------- */
const H_W = 320, H_H = 150;
const M = { top: 8, right: 8, bottom: 20, left: 32 };

function histSvg(p) {
  const total = p.counts.reduce((a, b) => a + b, 0) || 1;
  const probs = p.counts.slice(0, MAX_SEATS_SHOWN + 1).map(c => c / total);
  const yMax = niceMax(Math.max(...probs));
  const plotW = H_W - M.left - M.right, plotH = H_H - M.top - M.bottom;
  const band = plotW / (MAX_SEATS_SHOWN + 1);
  const barW = Math.max(1, band - 2);
  const x = s => M.left + s * band;
  const y = v => M.top + plotH - (v / yMax) * plotH;

  const svg = el("svg", {
    viewBox: `0 0 ${H_W} ${H_H}`, dir: "ltr", role: "img",
    "aria-label": `התפלגות מנדטים של ${p.name}`,
  });

  // Y gridlines + ticks
  for (const t of [yMax / 2, yMax]) {
    el("line", { x1: M.left, x2: H_W - M.right, y1: y(t), y2: y(t), class: "gridline" }, svg);
    el("text", { x: M.left - 4, y: y(t) + 3, "text-anchor": "end" }, svg).textContent =
      `${Math.round(t * 100)}%`;
  }
  // X ticks
  for (let s = 0; s <= MAX_SEATS_SHOWN; s += 10) {
    el("text", { x: x(s) + band / 2, y: H_H - 6, "text-anchor": "middle" }, svg).textContent = s;
  }

  // Bars + hover targets
  probs.forEach((v, s) => {
    const inCi = s >= p.ci_lower && s <= p.ci_upper;
    const top = y(v);
    const d = barPath(x(s) + (band - barW) / 2, top, barW, M.top + plotH - top, Math.min(4, barW / 2));
    if (d) el("path", { d, class: inCi ? "bar-in" : "bar-out" }, svg);
  });
  el("line", { x1: M.left, x2: H_W - M.right, y1: M.top + plotH, y2: M.top + plotH, class: "baseline" }, svg);

  // Hit targets: full-height column per seat count
  probs.forEach((v, s) => {
    const hit = el("rect", { x: x(s), y: M.top, width: band, height: plotH, class: "hit" }, svg);
    const hover = el("rect", { x: x(s), y: M.top, width: band, height: plotH, class: "hover-band" }, svg);
    const html = `<span class="tt-value">${fmtPct(v)}</span> <span class="tt-label">· ${s} מנדטים</span>`;
    hit.addEventListener("mousemove", e => { hover.classList.add("on"); showTooltip(e, html); });
    hit.addEventListener("mouseleave", () => { hover.classList.remove("on"); hideTooltip(); });
  });
  return svg;
}

function renderHistograms(active) {
  const grid = document.getElementById("hists");
  active.forEach((p, i) => {
    const card = document.createElement("article");
    card.className = "card hist";
    card.id = `hist-${i}`;
    card.innerHTML = `
      <h3>${esc(p.name)} <span class="symbol">${esc(p.symbol)}</span></h3>
      <p class="summary">ממוצע ${fmtNum(p.avg_seats, 2)} · רווח סמך 90%: ${rangeText(p)} · סיכוי לעבור את החסימה: ${fmtPct(p.prob_pass_threshold)}</p>`;
    card.appendChild(histSvg(p));
    grid.appendChild(card);
  });
}

const active = DATA.parties.filter(p => p.prob_pass_threshold > 0);
const inactive = DATA.parties.filter(p => p.prob_pass_threshold === 0);
renderHeader();
renderCiAxis();
renderTable(active, inactive);
renderHistograms(active);
</script>
